---
apiVersion: v1
kind: Service
metadata:
  name: museumapp-service
  labels:
    app: museumapp
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 3000
    nodePort: 30001
    protocol: TCP
  selector:
    app: museumapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museumapp
  labels:
    app: museumapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: museumapp
  template:
    metadata:
      labels:
        app: museumapp
    spec:
      containers:
      - name: museumapp
        image: ikergarcia2/museumapp:v1.1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: URL_BACKEND
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: backend_host
        - name: MESSAGEQUEUE_HOST
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: messagequeue_host
        - name: MESSAGEQUEUE_PORT
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: messagequeue_port
        - name: QUEUE_KEY
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: queue_key
---
apiVersion: v1
kind: Service
metadata:
  name: museumworker
  labels:
    app: museumworker
spec:
  selector:
    app: museumworker
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museumworker
  labels:
    app: museumworker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: museumworker
  template:
    metadata:
      labels:
        app: museumworker
    spec:
      containers:
      - name: museumworker
        image: pedroluis95/cloudcomputing:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: ARCHIVESTORE_HOST
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: archivestore_host
        - name: MESSAGEQUEUE_HOST
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: messagequeue_host
        - name: MESSAGEQUEUE_PORT
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: messagequeue_port
        - name: QUEUE_KEY
          valueFrom:
            configMapKeyRef:
              name: museumapp-config
              key: queue_key
---
apiVersion: v1
kind: Service
metadata:
  name: archivestore
  labels:
    app: archivestore
spec:
  ports:
  - port: 27017
    targetPort: mongodb-port
  selector:
    app: archivestore
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archivestore
  labels:
    app: archivestore
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: archivestore
  template:
    metadata:
      labels:
        app: archivestore
    spec:
      containers:
      - name: archivestore
        image: mongo
        ports:
        - containerPort: 27017
          name: mongodb-port
        volumeMounts:
        - name: archivestore-data
          mountPath: /data/db
        - name: mongo-config
          mountPath: /data/configdb
        - name: seed
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: seed
        configMap:
          name: archivestore-seed
  volumeClaimTemplates:
    - metadata:
        name: archivestore-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: 
            storage: 10Mi
    - metadata:
        name: mongo-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: 
            storage: 5Mi          
---
# ConfigMap to store ARCHIVESTORE_HOST variable in
# --------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: museumapp-config
  labels:
    data: config
data:
  backend_host: "http://museumworker:3001"
  archivestore_host: "archivestore"
  messagequeue_host: "messagequeue"
  messagequeue_port: "6379"
  queue_key: "archives:jobs"
---
# ---------- Seed data (runs only when the Mongo volume is empty) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: archivestore-seed
data:
  seed.js: |
    db = db.getSiblingDB("Archives");
    db.archives.insertMany([
      {"name": "DrCain", "description": "The human who created the Reploids", "imageUrl": "https://static.wikia.nocookie.net/megaman/images/6/61/Drcain.jpg/revision/latest/scale-to-width-down/268?cb=20181209035029"},
      { "name": "Capsule", "description": "The capsule that contained X", "imageUrl": "https://static.wikia.nocookie.net/megaman/images/4/4c/MMXCapsule.png/revision/latest/scale-to-width-down/153?cb=20181210222749"},
      { "name": "Sigma", "description": "The leader of the Maverick hunters", "imageUrl": "https://static.wikia.nocookie.net/megaman/images/e/e2/X4_SigmaGood_%28stitched%29.png/revision/latest/scale-to-width-down/180?cb=20221001170235"},
      { "name": "Thomas Light", "description": "The father of Robotics", "imageUrl": "https://megamanwiki.s3.us-east-va.io.cloud.ovh.us/thumb/c/c9/MHX_-_Dr._Light_Art_1.png/250px-MHX_-_Dr._Light_Art_1.png"},
      { "name": "X", "description": "The robot that inspired the creation of the reploids", "imageUrl": "https://static.wikia.nocookie.net/megaman/images/b/bb/MM_X_Titanium-X.png/revision/latest?cb=20130302182543"}
    ]);
---
apiVersion: v1
kind: Service
metadata:
  name: messagequeue
  labels:
    app: messagequeue
spec:
  selector:
    app: messagequeue
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: messagequeue
  labels:
    app: messagequeue
spec:
  serviceName: messagequeue
  replicas: 1
  selector:
    matchLabels:
      app: messagequeue
  template:
    metadata:
      labels:
        app: messagequeue
    spec:
      containers:
      - name: messagequeue
        image: redis:alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: messagequeue-data
          mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: messagequeue-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Mi
  args:
    - redis-server --appendonly yes

---